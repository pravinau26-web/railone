<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)"/>
  
  <!-- Train Front Silhouette -->
  <rect x="116" y="100" width="280" height="260" rx="48" fill="#ffffff" />
  
  <!-- Windshield -->
  <rect x="146" y="130" width="220" height="96" rx="20" fill="#1e293b" />
  <path d="M 176 142 L 336 142" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Train Headlights -->
  <circle cx="176" cy="286" r="22" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
  <circle cx="336" cy="286" r="22" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
  
  <!-- RailOne Emblem / Center Badge -->
  <rect x="232" y="266" width="48" height="36" rx="8" fill="url(#orangeGrad)"/>
  <text x="256" y="291" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">1</text>
  
  <!-- Train Cowcatcher / Tracks -->
  <path d="M 136 360 L 376 360 L 350 400 L 162 400 Z" fill="#94a3b8" />
  
  <!-- Tracks -->
  <line x1="80" y1="426" x2="432" y2="426" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <line x1="120" y1="446" x2="392" y2="446" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Text Label -->
  <text x="256" y="482" font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="2" text-anchor="middle">RailOne</text>
</svg>
